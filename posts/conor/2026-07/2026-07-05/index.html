        <p>週日</p>
<p>朝早佢地八點就起身係咁跳，九點食完麥當勞早餐喺屋企打機</p>
<p>打咗陣問去邊，家姐話去海洋公園就去啦</p>
<p>開頭都係睇下動物，然後玩下環迴水世界</p>
<p>之後食下飯團，航仔淨係食飯，唔肯食肉</p>
<p>食完家姐話要玩水，航仔一開始驚，後尾見悶，都係入去</p>
<p>入咗去就玩得好開心，但無同人battle，淨係自己射牆</p>
<p>玩到濕曬換衫，然後坐巴士返屋企</p>
<p>返屋企阿航就自己喺房打機</p>
<p>夜晚食吉野家，食完又睇電視打機，十點半瞓著</p>
